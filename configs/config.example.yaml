mysql:
  addr: "127.0.0.1:3306"
  user: "repl"
  password: "replpass"
  server_id: 1001
  flavor: mysql
  charset: utf8mb4

duckdb:
  path: "./data/sync.duckdb"

sync:
  # MySQL databases to sync
  databases: ["demo"]
  # Optional allowlist. Empty = all base tables with a primary key in the listed databases.
  # Supports "db.table" or glob: "demo.user_*"
  tables: []
  # Optional denylist (applied after allowlist). Use to skip large / noisy tables.
  # - "db.table" exact
  # - "table_name" or "prefix*" (any listed database)
  # - "db.big_*" glob on fully-qualified name
  exclude_tables:
    - "demo.big_logs"
    # - "*_archive"
  checkpoint: "./data/checkpoint.json"
  batch_size: 1000
  # Parallel MySQL readers + DuckDB connections for full dump.
  # Integer single-column PK tables are split into this many PK ranges.
  dump_concurrency: 4
  # debug: true

query_api:
  listen: ":8090"
  # token: "dev-token"
  max_rows: 1000
  timeout_sec: 30
